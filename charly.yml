#  RETIRED — opencharly/layer-openclaw-full.
#
#  This repo's entities were the `openclaw-full:` metalayer (the OpenClaw gateway
#  plus ~26 headless CLI tool layers) and its `openclaw-full-skill:` skill. The
#  OpenClaw family was consolidated into opencharly/openclaw
#  (opencharly/opencharly#431) and the variant metalayers were DROPPED rather than
#  moved: the family ships the gateway image and its layer, and no `-full`,
#  `-desktop` or `-ml` variant returns.
#
#  The tool layers this metalayer composed (codex, gemini, ripgrep, ffmpeg, gh, uv,
#  tmux, sqlite, ...) are NOT retired: they belong to their own repos and stay
#  available. What is gone is the pre-packaged "gateway plus everything"
#  composition; a consumer that wants a tool composes it beside the gateway image.
#
#  Nothing composes this repo any more. Its submodule gitlink and its refs-list pin
#  are removed in the same cutover; the repo itself is kept only until the operator
#  archives it (out of scope here).
